<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">Alan-Verse</title><desc id="d">Skyline noturno, portal, rede de dados e logotipo tecnológico de Alan Kordel.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030711"/><stop offset=".55" stop-color="#041d4d"/><stop offset="1" stop-color="#24000b"/></linearGradient><radialGradient id="p"><stop offset=".5" stop-color="#02040a"/><stop offset=".68" stop-color="#008cff" stop-opacity=".9"/><stop offset=".82" stop-color="#ff003c" stop-opacity=".9"/><stop offset="1" stop-color="#060910" stop-opacity="0"/></radialGradient><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#f0f6fc" opacity=".08"/></pattern><clipPath id="logoClip"><circle cx="968" cy="165" r="88"/></clipPath><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff003c" flood-opacity=".8"/><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#008cff" flood-opacity=".9"/></filter><style>.web{stroke-dasharray:9 18;animation:draw 5s linear infinite}.node{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}.portal{transform-origin:968px 165px;animation:spin 18s linear infinite}.brand{transform-origin:968px 165px;animation:brandPulse 4s ease-in-out infinite}.light{animation:lights 3s steps(2) infinite}.l2{animation-delay:-1.5s}@keyframes draw{to{stroke-dashoffset:-54}}@keyframes pulse{50%{transform:scale(1.8);opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes brandPulse{0%,100%{transform:scale(.96);opacity:.92}50%{transform:scale(1.04);opacity:1}}@keyframes lights{50%{opacity:.15}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/><rect width="1200" height="360" rx="18" fill="url(#dots)"/>
